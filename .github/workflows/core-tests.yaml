name: core-tests

on: push

jobs:
  run-core-tests:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/everest/everest-demo/manager:2025.6.1-dt-esdp
    services:
      mqtt-server:
        image: ghcr.io/everest/everest-demo/mqtt-server:2025.6.1-dt-esdp
        options:
          log-driver: none
    env:
      MQTT_SERVER_ADDRESS: mqtt-server
    steps:
      - name: Run core tests
        working-directory: /ext/source/tests
        run: |
          cmake --build /ext/build --target install_everest_testing
          . /ext/build/venv/bin/activate
          pytest --everest-prefix /ext/dist core_tests/*.py framework_tests/*.py

