name: core-tests

on: push

jobs:
  run-core-tests:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/everest/everest-demo/manager:2025.6.1-dt-esdp
    steps:
      - name: Run core tests
        run: |
          python3 -m venv /ext/build/venv
          . /ext/build/venv/bin/activate
          cmake --build /ext/build --target install_everest_testing
          pytest --everest-prefix /ext/dist core_tests/*.py framework_tests/*.py

